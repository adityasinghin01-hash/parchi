name: ParchiFrontend
options:
  bundleIdPrefix: in.tessanova
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  ParchiFrontend:
    type: application
    platform: iOS
    sources: [ParchiFrontend]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.tessanova.parchi.frontend
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Parchi
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocationWhenInUseUsageDescription: "Parchi uses your area to help find nearby pharmacies and labs. You can choose an area manually instead."
        NSCameraUsageDescription: "Parchi uses the camera when you choose to scan a prescription."
        NSPhotoLibraryUsageDescription: "Parchi accesses only the photos you allow so you can choose a prescription image."
  ParchiFrontendUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ParchiFrontendUITests]
    dependencies:
      - target: ParchiFrontend
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ParchiFrontend:
    build:
      targets:
        ParchiFrontend: all
    test:
      targets: [ParchiFrontendUITests]
