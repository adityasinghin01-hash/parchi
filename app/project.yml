name: Parchi
options:
  bundleIdPrefix: in.tessanova
  deploymentTarget:
    iOS: "17.0"
packages:
  ParchiCore:
    path: ../engine/ParchiCore
targets:
  Parchi:
    type: application
    platform: iOS
    sources:
      - path: Parchi
      - path: ../engine/scenarios
        buildPhase: resources
      - path: ../engine/catalogue
        buildPhase: resources
    dependencies:
      - package: ParchiCore
        product: ParchiCore
    info:
      path: Info.plist
      properties:
        NSCameraUsageDescription: "Parchi uses the camera only to photograph your parchi on this phone. Parchi tries to hide the name, phone and address on this phone and shows you the picture to check before you continue."
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Image
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.image
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Lab booking: write-only calendar access to add the confirmed slot. (Local notifications need no key.)
        NSCalendarsWriteOnlyAccessUsageDescription: "Parchi adds your confirmed lab slot to your calendar. It cannot read your other events."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.tessanova.parchi
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Parchi
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Parchi talks to the lab server on your local network for order tracking."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Parchi uses your location to show shops and labs near you. The map search sends the area around you to Apple Maps. You can pick a city instead."
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
  ParchiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ParchiUITests
    dependencies:
      - target: Parchi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.tessanova.parchi.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Parchi
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
  ParchiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ParchiTests
    dependencies:
      - target: Parchi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.tessanova.parchi.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
schemes:
  Parchi:
    shared: true
    build:
      targets:
        Parchi: all
    test:
      targets:
        - ParchiTests
        - ParchiUITests
