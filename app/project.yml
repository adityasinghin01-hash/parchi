name: Parchi
options:
  bundleIdPrefix: in.tessanova
  deploymentTarget:
    iOS: "17.0"
packages:
  ParchiCore:
    path: ../engine/ParchiCore
targets:
  Parchi:
    type: application
    platform: iOS
    sources:
      - path: Parchi
      - path: ../engine/scenarios
        buildPhase: resources
      - path: ../engine/catalogue
        buildPhase: resources
    dependencies:
      - package: ParchiCore
        product: ParchiCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.tessanova.parchi
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Parchi
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
